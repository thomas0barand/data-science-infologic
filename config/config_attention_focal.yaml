# Hydra Configuration for Attention-LSTM User Identification
# FOCAL LOSS MODEL: Using focal loss and AdamW for handling class imbalance
# Goal: Better handling of hard examples and rare classes

# Random seed for reproducibility
seed: 42

# Data configuration
data:
  train_path: "train"
  test_path: "test"
  data_dir: "data"
  size: "full"
  max_sequence_length: 5000
  train_split: 0.8
  batch_size: 16
  num_workers: 7

# Model architecture
model:
  # Embedding and LSTM
  embedding_dim: 160  # Between small and large
  hidden_size: 320
  num_layers: 3
  dropout: 0.35
  bidirectional: true
  
  # Attention mechanism
  attention_dim: 160
  
  # Feature fusion
  fusion_hidden_size: 640

# Training configuration
training:
  max_epochs: 55
  accelerator: "auto"
  devices: 1
  precision: "32"
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  
  # Loss function - FOCAL LOSS ENABLED
  use_focal_loss: true  # ENABLED
  use_class_weights: true
  
  # Focal loss parameters
  focal_loss:
    gamma: 2.5  # Increased focus on hard examples
    alpha_mode: "balanced"
  
  # Early stopping
  early_stopping:
    monitor: "val_f1"
    patience: 15
    mode: "max"
    min_delta: 0.001
  
  # Checkpointing
  checkpoint:
    monitor: "val_f1"
    mode: "max"
    save_top_k: 1
    save_last: true
    filename: "epoch={epoch:02d}-val_f1={val_f1:.4f}"

# Optimizer configuration - USING ADAMW
optimizer:
  name: "adamw"  # Changed to AdamW
  lr: 0.0004
  weight_decay: 0.01  # Higher weight decay for AdamW

# Learning rate scheduler - COSINE ANNEALING
scheduler:
  name: "cosine"  # Changed to cosine annealing
  
  reduce_on_plateau:
    monitor: "val_f1"
    factor: 0.5
    patience: 5
    min_lr: 0.00001
    mode: "max"
  
  cosine:
    T_max: 25
    eta_min: 0.000005
  
  step:
    step_size: 10
    gamma: 0.5

# Paths for saving results
paths:
  output_dir: "/content/drive/MyDrive/data-science-infologic/results/rnn_models"
  logs_dir: "logs"
  metrics_dir: "results/metrics"

# Hydra configuration
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: false

