# Hydra Configuration for RNN User Identification
# This file contains all hyperparameters for training

# Random seed for reproducibility
seed: 42

# Data configuration
data:
  train_path: "train"
  test_path: "test"
  data_dir: "data"
  size: "full"  # "small" or "full"
  max_sequence_length: 5000
  train_split: 0.8
  batch_size: 32
  num_workers: 7

# Model architecture
model:
  embedding_dim: 128
  hidden_size: 256
  num_layers: 2
  dropout: 0.5
  bidirectional: false

# Training configuration
training:
  max_epochs: 25
  accelerator: "auto"  # "auto", "gpu", "cpu", "mps"
  devices: 1
  precision: "32"  # "32", "16", "bf16"
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  
  # Early stopping
  early_stopping:
    monitor: "val_loss"
    patience: 10
    mode: "max"
    min_delta: 0.001
  
  # Checkpointing
  checkpoint:
    monitor: "val_loss"
    mode: "max"
    save_top_k: 1
    save_last: true
    filename: "epoch={epoch:02d}-val_loss={val_loss:.4f}"

# Optimizer configuration
optimizer:
  name: "adam"  # "adam", "sgd", "adamw"
  lr: 0.001
  weight_decay: 0.0001
  
# Learning rate scheduler
scheduler:
  name: "reduce_on_plateau"  # "reduce_on_plateau", "cosine", "step", "none"
  
  # ReduceLROnPlateau parameters
  reduce_on_plateau:
    monitor: "val_loss"
    factor: 0.5
    patience: 3
    min_lr: 0.00001
    mode: "min"
  
  # CosineAnnealing parameters
  cosine:
    T_max: 10
    eta_min: 0.00001
  
  # StepLR parameters
  step:
    step_size: 5
    gamma: 0.5

# Paths for saving results
paths:
  output_dir: "/content/drive/MyDrive/data-science-infologic/results/rnn_models"
  logs_dir: "/content/drive/MyDrive/data-science-infologic/logs"
  metrics_dir: "/content/drive/MyDrive/data-science-infologic/results/metrics"

# Hydra configuration
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: false

