# Hydra Configuration for Attention-LSTM User Identification
# DEEP MODEL: More layers with moderate dimensions for learning hierarchical patterns
# Goal: Learn deeper hierarchical representations

# Random seed for reproducibility
seed: 42

# Data configuration
data:
  train_path: "train"
  test_path: "test"
  data_dir: "data"
  size: "full"
  max_sequence_length: 5000
  train_split: 0.8
  batch_size: 16
  num_workers: 7

# Model architecture - DEEPER NETWORK
model:
  # Embedding and LSTM - MORE LAYERS
  embedding_dim: 128
  hidden_size: 256
  num_layers: 4       # Increased to 4 layers
  dropout: 0.35       # Moderate dropout
  bidirectional: true
  
  # Attention mechanism
  attention_dim: 192  # Moderate attention dimension
  
  # Feature fusion
  fusion_hidden_size: 768  # Moderate fusion size

# Training configuration
training:
  max_epochs: 60  # More epochs for deeper model
  accelerator: "auto"
  devices: 1
  precision: "32"
  gradient_clip_val: 0.8  # Stricter gradient clipping for deep model
  accumulate_grad_batches: 1
  
  # Loss function
  use_focal_loss: false
  use_class_weights: true
  
  # Focal loss parameters
  focal_loss:
    gamma: 2.0
    alpha_mode: "balanced"
  
  # Early stopping
  early_stopping:
    monitor: "val_f1"
    patience: 18  # More patience for deeper model
    mode: "max"
    min_delta: 0.001
  
  # Checkpointing
  checkpoint:
    monitor: "val_f1"
    mode: "max"
    save_top_k: 1
    save_last: true
    filename: "epoch={epoch:02d}-val_f1={val_f1:.4f}"

# Optimizer configuration
optimizer:
  name: "adam"
  lr: 0.0004  # Moderate learning rate
  weight_decay: 0.00015

# Learning rate scheduler
scheduler:
  name: "reduce_on_plateau"
  
  reduce_on_plateau:
    monitor: "val_f1"
    factor: 0.6
    patience: 6
    min_lr: 0.000005
    mode: "max"
  
  cosine:
    T_max: 20
    eta_min: 0.000005
  
  step:
    step_size: 10
    gamma: 0.5

# Paths for saving results
paths:
  output_dir: "/content/drive/MyDrive/data-science-infologic/results/rnn_models"
  logs_dir: "logs"
  metrics_dir: "results/metrics"

# Hydra configuration
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: false

