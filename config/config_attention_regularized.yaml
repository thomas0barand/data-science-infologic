# Hydra Configuration for Attention-LSTM User Identification
# REGULARIZED MODEL: Heavy regularization for better generalization
# Goal: Prevent overfitting with strong regularization

# Random seed for reproducibility
seed: 42

# Data configuration
data:
  train_path: "train"
  test_path: "test"
  data_dir: "data"
  size: "full"
  max_sequence_length: 5000
  train_split: 0.8
  batch_size: 20  # Slightly larger batch for better generalization
  num_workers: 7

# Model architecture - SMALLER WITH HIGH REGULARIZATION
model:
  # Embedding and LSTM - SMALLER DIMENSIONS
  embedding_dim: 96   # Reduced from 128
  hidden_size: 192    # Reduced from 256
  num_layers: 2
  dropout: 0.5        # INCREASED DROPOUT
  bidirectional: true
  
  # Attention mechanism
  attention_dim: 96   # Reduced
  
  # Feature fusion
  fusion_hidden_size: 384  # Reduced from 512

# Training configuration
training:
  max_epochs: 50
  accelerator: "auto"
  devices: 1
  precision: "32"
  gradient_clip_val: 1.2  # Slightly higher
  accumulate_grad_batches: 1
  
  # Loss function
  use_focal_loss: false
  use_class_weights: true
  
  # Focal loss parameters
  focal_loss:
    gamma: 2.0
    alpha_mode: "balanced"
  
  # Early stopping
  early_stopping:
    monitor: "val_f1"
    patience: 20  # More patience for regularized model
    mode: "max"
    min_delta: 0.0005  # Smaller delta
  
  # Checkpointing
  checkpoint:
    monitor: "val_f1"
    mode: "max"
    save_top_k: 1
    save_last: true
    filename: "epoch={epoch:02d}-val_f1={val_f1:.4f}"

# Optimizer configuration
optimizer:
  name: "adam"
  lr: 0.0006  # Slightly higher learning rate for smaller model
  weight_decay: 0.0005  # INCREASED WEIGHT DECAY

# Learning rate scheduler
scheduler:
  name: "reduce_on_plateau"
  
  reduce_on_plateau:
    monitor: "val_f1"
    factor: 0.5
    patience: 7
    min_lr: 0.00001
    mode: "max"
  
  cosine:
    T_max: 20
    eta_min: 0.00001
  
  step:
    step_size: 10
    gamma: 0.5

# Paths for saving results
paths:
  output_dir: "/content/drive/MyDrive/data-science-infologic/results/rnn_models"
  logs_dir: "logs"
  metrics_dir: "results/metrics"

# Hydra configuration
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: false

