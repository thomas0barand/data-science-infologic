[tool.poetry]
name = "data-science-infologic"
version = "0.1.0"
description = "Introduction to Data Science Project - Infologic"
authors = ["thomas0barand <th.barand@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
numpy = "^2.3.3"
pandas = "^2.3.3"
matplotlib = "^3.10.7"
scikit-learn = "^1.6.1"
joblib = "^1.4.2"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=6.30.1,<7.0.0)"
]
