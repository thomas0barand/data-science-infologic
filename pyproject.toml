[tool.poetry]
name = "data-science-infologic"
version = "0.1.0"
description = "Introduction to Data Science Project - Infologic"
authors = ["thomas0barand <th.barand@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
numpy = "^1.26.0"
pandas = "^2.3.0"
matplotlib = "^3.10.0"
scikit-learn = "^1.7.0"
scipy = "^1.16.0"
joblib = "^1.5.0"
torch = "2.2.2"
pytorch-lightning = "^2.5.0"
hydra-core = "^1.3.0"
omegaconf = "^2.3.0"
tensorboard = "^2.20.0"
tensorboardx = "^2.6.0"
torchmetrics = "^1.8.0"
tqdm = "^4.67.0"
PyYAML = "^6.0.0"
seaborn = "^0.13.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=6.30.1,<7.0.0)"
]
