seed: 42
data:
  train_path: train
  test_path: test
  data_dir: data
  size: full
  max_sequence_length: 1000
  train_split: 0.8
  batch_size: 64
  num_workers: 4
model:
  embedding_dim: 32
  hidden_size: 64
  num_layers: 1
  dropout: 0.2
  bidirectional: false
  attention_dim: 64
  fusion_hidden_size: 256
training:
  max_epochs: 1000
  accelerator: auto
  devices: 1
  precision: '32'
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  use_focal_loss: false
  use_class_weights: true
  focal_loss:
    gamma: 2.0
    alpha_mode: balanced
  early_stopping:
    monitor: val_f1
    patience: 8
    mode: max
    min_delta: 0.001
  checkpoint:
    monitor: val_f1
    mode: max
    save_top_k: 1
    save_last: true
    filename: epoch={epoch:02d}-val_f1={val_f1:.4f}
optimizer:
  name: adam
  lr: 0.001
  weight_decay: 0.0001
scheduler:
  name: reduce_on_plateau
  reduce_on_plateau:
    monitor: val_f1
    factor: 0.5
    patience: 4
    min_lr: 1.0e-05
    mode: max
  cosine:
    T_max: 10
    eta_min: 1.0e-05
  step:
    step_size: 5
    gamma: 0.5
paths:
  output_dir: results/rnn_models
  logs_dir: logs
  metrics_dir: results/metrics
cache:
  cache_dir: cache
