# Hydra Configuration for Attention-LSTM User Identification
# Config for attention_lstm_light_20251020_102622 model
# Training metrics: Accuracy=0.9600, F1_weighted=0.9587, F1_macro=0.9602

# Random seed for reproducibility
seed: 42

# Data configuration
data:
  train_path: "train"
  test_path: "test"
  data_dir: "data"
  size: "full"          # Full dataset
  max_sequence_length: 2000  # Maximum sequence length for padding/truncation
  train_split: 0.8
  batch_size: 64        # Batch size for training and inference
  num_workers: 7        # Optimized for local CPU

# Model architecture - Reconstructed from checkpoint
model:
  # Embedding and LSTM
  embedding_dim: 96      # Embedding dimension
  hidden_size: 128       # LSTM hidden size
  num_layers: 1         # Single layer LSTM
  dropout: 0.2          # Dropout rate
  bidirectional: false  # Unidirectional LSTM
  
  # Attention mechanism
  attention_dim: 128     # Attention dimension
  
  # Feature fusion
  fusion_hidden_size: 512  # Fusion layer hidden size

# Training configuration
training:
  max_epochs: 200        # Maximum training epochs
  accelerator: "auto"
  devices: 1
  precision: "32"
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  
  # Loss function
  use_focal_loss: false
  use_class_weights: true
  
  # Focal loss parameters (not used but kept for consistency)
  focal_loss:
    gamma: 2.0
    alpha_mode: "balanced"
  
  # Early stopping
  early_stopping:
    monitor: "val_f1"
    patience: 20
    mode: "max"
    min_delta: 0.001
  
  # Checkpointing
  checkpoint:
    monitor: "val_f1"
    mode: "max"
    save_top_k: 1
    save_last: true
    filename: "epoch={epoch:02d}-val_f1={val_f1:.4f}"

# Optimizer configuration
optimizer:
  name: "adam"
  lr: 0.001            # Learning rate
  weight_decay: 0.0001 # Weight decay

# Learning rate scheduler
scheduler:
  name: "reduce_on_plateau"
  
  reduce_on_plateau:
    monitor: "val_f1"
    factor: 0.5
    patience: 4         # Patience for LR reduction
    min_lr: 0.00001
    mode: "max"
  
  cosine:
    T_max: 10
    eta_min: 0.00001
  
  step:
    step_size: 5
    gamma: 0.5

# Paths for saving results - Local paths
paths:
  output_dir: "results/models"
  logs_dir: "logs"
  metrics_dir: "results/metrics"

# Hydra configuration
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: false

cache:
  cache_dir: "cache"

